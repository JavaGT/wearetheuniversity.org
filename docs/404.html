<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · WEARETHEUNIVERSITY</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1 class="logo"><a href="/" style="color:inherit; text-decoration:none;">We Are The University</a></h1>
    <nav aria-label="Primary">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/about/">About</a></li>
        <li><a href="/contact/">Contact</a></li>
        <li><a href="https://blog.wearetheuniversity.org/">Blog ↗</a></li>
        <li><a href="https://archive.wearetheuniversity.org/">Archive ↗</a></li>
        <li><a href="/arcade/">Arcade</a></li>
        <li><a href="/tools/">Tools</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1>404 — Page not found</h1>
    <p id="message">Sorry, we couldn't find that page.</p>
    <p>
      <a href="/">Home</a>
      · <a href="https://blog.wearetheuniversity.org/">Blog</a>
      · <a href="https://archive.wearetheuniversity.org/">Archive</a>
    </p>
  </main>
  <footer class="site-footer">
    <p><a href="/">WEARETHEUNIVERSITY</a></p>
  </footer>
  <script>
    (function () {
      var path = window.location.pathname || "";
      var qs = window.location.search + window.location.hash;
      var msg = document.getElementById("message");

      if (path === "/archive" || path.indexOf("/archive/") === 0) {
        msg.textContent = "Redirecting to the research archive…";
        window.location.replace("https://archive.wearetheuniversity.org" + path + qs);
        return;
      }

      if (path === "/blog" || path.indexOf("/blog/") === 0) {
        // Blog index on subdomain is / ; deep posts keep /blog/...
        var targetPath = (path === "/blog" || path === "/blog/") ? "/" : path;
        msg.textContent = "Redirecting to the blog…";
        window.location.replace("https://blog.wearetheuniversity.org" + targetPath + qs);
      }
    })();
  </script>
</body>
</html>
